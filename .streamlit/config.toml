[server]
headless = true

[client]
showErrorDetails = "full"                # a hosted demo should show the real error, not a redacted one

# Look and feel taken from a screenshot of clay.com (Design.png): a white page, black text, black and cream buttons,
# hairline grey rules (#e6e8ec), grey secondary text (#525a69) and blue links (#0382f7). The theme is locked to light
# so it always matches. Clay's typeface (Roobert) is licensed and is not embedded: Figtree is the closest free font.
# The layout details (floating nav, hairline grids, tags) live in assets/clay.css.

[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2ed"     # the cream of the 'Get a demo' button
textColor = "#000000"
linkColor = "#0382f7"
linkUnderline = false
borderColor = "#e6e8ec"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.5rem"
paddingTop = "0.5rem"
buttonRadius = "0.75rem"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'DM Mono':https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["2.25rem", "1.75rem", "1.5rem", "1.125rem"]
headingFontWeights = [500, 500, 500, 500]
metricValueFontSize = "2rem"
metricValueFontWeight = 500
codeBackgroundColor = "#f3f2ed"
codeTextColor = "#16181f"
dataframeBorderColor = "#e6e8ec"
dataframeHeaderBackgroundColor = "#f7f8f9"
dataframeHeaderTextColor = "#525a69"
blueColor = "#0382f7"                    # blueberry-500
blueBackgroundColor = "#ecf6ff"          # blueberry-50
blueTextColor = "#01418d"
greenColor = "#2f7751"
greenBackgroundColor = "#e1f0e7"
greenTextColor = "#01533c"
redColor = "#e94d68"
redBackgroundColor = "#ffebec"
redTextColor = "#b21a3f"
orangeColor = "#fc8936"
orangeBackgroundColor = "#ffe9d5"
orangeTextColor = "#9f3e15"
yellowColor = "#cbd810"
yellowBackgroundColor = "#fcfee2"
yellowTextColor = "#5e5e00"
violetColor = "#8b5cf6"
violetBackgroundColor = "#e9e4ff"
violetTextColor = "#5c15cc"
grayColor = "#717989"
grayBackgroundColor = "#f3f2ed"
grayTextColor = "#525a69"
chartCategoricalColors = ["#000000", "#cbd810", "#0382f7", "#2f7751", "#ff7ad5", "#fbbd41", "#8b5cf6", "#e94d68"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"   # white, outlined inputs like the reference search box
borderColor = "#e6e8ec"
