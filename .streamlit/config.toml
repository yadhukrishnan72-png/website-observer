[server]
headless = true

# Look and feel modelled on clay.com: Clay's own palette tokens (blueberry, matcha, pomegranate, tangarine, lemon,
# ube, grey, oat) and a Roobert-style type system. Clay's Roobert and Canela are licensed fonts, so free look-alikes
# are used: Inter (which clay.com also uses), DM Sans for headings and DM Mono for code.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "'DM Sans':https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap, sans-serif"
codeFont = "'DM Mono':https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem", "1.125rem"]
headingFontWeights = [600, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#0667d9"                 # blueberry-600
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f9f8f6"     # oat-100
textColor = "#16181f"                    # grey-950
linkColor = "#0053b5"                    # blueberry-700
borderColor = "#d6d9df"                  # grey-300
codeBackgroundColor = "#f3f2ed"          # oat-200
codeTextColor = "#282c35"                # grey-900
dataframeBorderColor = "#e6e8ec"         # grey-200
dataframeHeaderBackgroundColor = "#f3f2ed"
dataframeHeaderTextColor = "#282c35"
blueColor = "#0667d9"
blueBackgroundColor = "#d7ebfe"          # blueberry-100
blueTextColor = "#01418d"                # blueberry-800
greenColor = "#0dac65"                   # matcha-500
greenBackgroundColor = "#dbffe0"         # matcha-100
greenTextColor = "#02693e"               # matcha-700
redColor = "#e94d68"                     # pomegranate-500
redBackgroundColor = "#ffebec"           # pomegranate-100
redTextColor = "#b21a3f"                 # pomegranate-700
orangeColor = "#fc8936"                  # tangarine-500
orangeBackgroundColor = "#ffe9d5"        # tangarine-100
orangeTextColor = "#9f3e15"              # tangarine-800
yellowColor = "#fbbd41"                  # lemon-500
yellowBackgroundColor = "#fff8d2"        # lemon-100
yellowTextColor = "#7f500a"              # lemon-900
violetColor = "#8b5cf6"                  # ube-500
violetBackgroundColor = "#e9e4ff"        # ube-100
violetTextColor = "#5c15cc"              # ube-700
grayColor = "#717989"                    # grey-600
grayBackgroundColor = "#eff1f3"          # grey-100
grayTextColor = "#525a69"                # grey-700
chartCategoricalColors = ["#0382f7", "#ff7ad5", "#fbbd41", "#0dac65", "#8b5cf6", "#3bd3fd", "#fc8936", "#e94d68"]

[theme.dark]
