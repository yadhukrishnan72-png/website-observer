blueBackgroundColor = "#002f67"
blueTextColor = "#bee0ff"                # blueberry-200
greenColor = "#0dac65"
greenBackgroundColor = "#03331d"         # matcha-900
greenTextColor = "#bcf4ca"               # matcha-200
redColor = "#e94d68"
redBackgroundColor = "#8b045c"           # dragonfruit-900
redTextColor = "#ffe5f7"                 # dragonfruit-100
orangeColor = "#fc8936"
orangeBackgroundColor = "#752b12"        # tangarine-900
orangeTextColor = "#fdd4b7"              # tangarine-200
yellowColor = "#fbbd41"
yellowBackgroundColor = "#7f500a"        # lemon-900
