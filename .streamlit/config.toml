borderColor = "#01418d"                  # blueberry-800
codeBackgroundColor = "#002f67"          # blueberry-900
codeTextColor = "#d7ebfe"
dataframeBorderColor = "#01418d"
dataframeHeaderBackgroundColor = "#002f67"
dataframeHeaderTextColor = "#d7ebfe"
